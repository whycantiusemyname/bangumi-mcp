[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "bangumi-mcp"
version = "0.1.0"
description = "Full-featured Bangumi API v0 MCP Server and lightweight CLI (subjects, calendar, episodes, characters, persons, collections sync & dedup, progress, indices)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "whycantiusemyname" },
]
keywords = ["bangumi", "bgm", "mcp", "model-context-protocol", "anime", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx>=0.27.0",
    "mcp>=1.8.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/whycantiusemyname/bangumi-mcp"
Repository = "https://github.com/whycantiusemyname/bangumi-mcp"
Issues = "https://github.com/whycantiusemyname/bangumi-mcp/issues"

[project.scripts]
bangumi-mcp = "bangumi_mcp.cli:main_mcp"
bangumi-cli = "bangumi_mcp.cli:main_cli"

[tool.hatch.build.targets.wheel]
packages = ["src/bangumi_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
